<!DOCTYPE html>
<!-- Source of assets/og.png (1200x630 link-preview image). Regenerate with:
     google-chrome --headless=new --virtual-time-budget=10000 --window-size=1200,760 --screenshot=/tmp/og-full.png assets/og.html
     then crop the top 1200x630 (headless Chrome's viewport is shorter than the window):
     python3 -c "from PIL import Image; Image.open('/tmp/og-full.png').crop((0,0,1200,630)).save('assets/og.png', optimize=True)"
     Uses the app's own label renderers so the image always matches the real designs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arrakis Spice Labels — preview image</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;700&family=Jost:wght@400;500&family=Limelight&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: linear-gradient(180deg, #f3e4bd 0%, #e9cd93 60%, #dcb872 100%); color: #2b1a0c; font-family: 'Cormorant Garamond', Georgia, serif; }
  .ridge { position: absolute; left: 0; bottom: 0; width: 1200px; height: 170px; }
  .copy { position: absolute; left: 70px; top: 70px; width: 640px; }
  .kicker { font-family: 'Cinzel', serif; font-size: 20px; letter-spacing: .38em; text-transform: uppercase; color: #a4451a; }
  h1 { margin: 16px 0 0; font-family: 'Cinzel', serif; font-weight: 700; font-size: 64px; line-height: 1.08; letter-spacing: .03em; text-transform: uppercase; }
  .sub { margin-top: 22px; font-size: 32px; font-style: italic; color: #6b4f2e; line-height: 1.2; }
  .lbl { position: absolute; filter: drop-shadow(0 8px 10px rgba(58, 35, 17, .38)); }
  .lbl svg { width: 100% !important; height: auto !important; }
  .lids { position: absolute; left: 70px; top: 400px; }
</style>
</head>
<body>
  <svg class="ridge" viewBox="0 0 1200 170" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,86 C150,20 300,130 470,72 S760,4 930,64 S1120,120 1200,56 V170 H0Z" fill="#c9974f"/>
    <path d="M0,122 C170,66 320,150 500,110 S780,64 950,108 S1130,142 1200,100 V170 H0Z" fill="#a8722f"/>
  </svg>
  <div class="copy">
    <div class="kicker">The spice must flow</div>
    <h1>Label your spice.</h1>
    <div class="sub">Jar, lid &amp; box labels for your spice shakers.<br>Pick a design, print on A4.</div>
  </div>
  <div id="labels"></div>

  <script src="../js/svgutil.js"></script>
  <script src="../js/fit.js"></script>
  <script src="../js/designs/registry.js"></script>
  <script src="../js/designs/skandinavisk.js"></script>
  <script src="../js/designs/apotek.js"></script>
  <script src="../js/designs/brutalist.js"></script>
  <script src="../js/designs/artdeco.js"></script>
  <script src="../js/designs/editorial.js"></script>
  <script>
    const S = Spice;
    Promise.all(S.fontSpecs.map((s) => document.fonts.load(s))).then(() => {
      const item = (name, sub, no) => ({ name, sub, origin: '', no, cat: 'Krydder' });
      const rects = [
        { d: 'editorial', it: item('Paprika', 'søt', 201), x: 740, y: 52, w: 390, r: -3 },
        { d: 'artdeco', it: item('Melange', 'the spice', 101), x: 770, y: 222, w: 390, r: 2 },
        { d: 'apotek', it: item('Kanel', '', 406), x: 730, y: 392, w: 390, r: -2 },
      ];
      const lids = [
        { d: 'editorial', it: item('Paprika', '', 201) },
        { d: 'artdeco', it: item('Melange', 'spice', 101) },
        { d: 'apotek', it: item('Kanel', 'malt', 406) },
      ];
      let h = rects.map((r) =>
        `<div class="lbl" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;transform:rotate(${r.r}deg)">${S.designs.get(r.d).rect(r.it)}</div>`).join('');
      h += lids.map((l, i) =>
        `<div class="lbl" style="left:${70 + i * 185}px;top:410px;width:165px;transform:rotate(${[-6, 4, -3][i]}deg)">${S.designs.get(l.d).circle(l.it, { hole: true, notch: true })}</div>`).join('');
      document.getElementById('labels').innerHTML = h;
    });
  </script>
</body>
</html>
